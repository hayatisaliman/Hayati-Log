[package]
name = "hayati-log"
version = "0.1.3"
description = "Hayati Log — daily and monthly notes"
authors = ["Hayati"]
edition = "2021"

[lib]
name = "hayati_report_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hayati-log"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "=2.8.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
